name: CI

# WHY THIS EXISTS
# `deploy.yml` triggers on push to `main` and immediately SSHes into the Linode box to run
# scripts/deploy.sh — so merging a PR IS deploying to production. Until this workflow was
# added there was NO automated gate anywhere: no typecheck, no build, no test ran on a pull
# request. A type error or a broken test reached prod and was only discovered when
# `turbo build` failed ON the server, which (per CLAUDE.md) can leave pm2 serving stale code
# for one app while the others rebuild.
#
# This runs on pull requests so a PR can be verified BEFORE it is merged/deployed.
#
# ⚠️ It deliberately does NOT gate deploy.yml. Making deploy `needs: ci` would be the
# stronger setup, but it changes the deploy pipeline's behavior (a flaky or queued CI run
# would block an urgent deploy). That is a separate, deliberate decision for the owner —
# see the CI note in CLAUDE.md.

on:
  pull_request:
  workflow_dispatch:

# A newer push to the same PR supersedes the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dashmani
        ports:
          - 5432:5432
        # Wait until the DB actually accepts connections — without this, `db push` races
        # the container start and fails intermittently.
        options: >-
          --health-cmd "pg_isready -U user -d dashmani"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Matches docker-compose.yml / .env.example defaults so local and CI agree.
      #
      # ⚠️ connection_limit=1 is deliberate and load-bearing for the test run.
      # Several service paths write FIRE-AND-FORGET (audit logs, recordApiUsage,
      # dispatchNotification). With a multi-connection pool, one of those INSERTs can still
      # be in flight on another backend when the next test's beforeEach issues its TRUNCATE,
      # producing a real lock-order inversion (the INSERT holds a RowExclusiveLock and wants
      # a table TRUNCATE already locked, while TRUNCATE wants that table) — Postgres kills
      # one side with SQLSTATE 40P01 and a random leaderboard test fails. Draining
      # pg_stat_activity first helps but cannot close it, because the straggler is often a
      # JS continuation that issues its query AFTER the drain check.
      #
      # Pinning the pool to a single connection makes those queries strictly sequential, so
      # the inversion cannot form at all. `withConnectionPool()` in packages/db only fills in
      # defaults for params the URL does not already specify, so this explicit value wins.
      # It affects the test run only — production keeps connection_limit=10.
      DATABASE_URL: postgresql://user:password@localhost:5432/dashmani?connection_limit=1
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-secret-refresh
      SEED_ADMIN_PASSWORD: Admin@123456
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1
      INTERNAL_APP_URL: http://localhost:3000
      HR_APP_URL: http://localhost:3002
      # Next.js production builds already skip ESLint (next.config.js
      # eslint.ignoreDuringBuilds); keep builds from being slowed by telemetry.
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      # P8 source guards — plain greps, so they run before npm ci and fail fast:
      # - no regex lookbehind in apps/hr/src, packages/shared/src or mobile/src (older
      #   iOS Safari throws a SyntaxError at PARSE time, taking the whole page down);
      # - pipeline API code (services/pipeline/**, routes/pipeline.routes.ts,
      #   middleware/pipeline-*.ts, cron/pipeline-*.cron.ts) imports its DB client only
      #   via services/pipeline/db.ts, never @dashmani/db or @prisma/client (the global
      #   pool inside a pipeline transaction breaks the pool arithmetic and deadlocks at
      #   connection_limit=1, and draws from the pool login and HR submit share);
      # - no localeCompare in server pipeline code, and none on ranks in the HR pipeline
      #   pages/components (ranks are compared byte-wise, COLLATE "C").
      # Paths that do not exist yet are skipped with a note; see the script header.
      - name: Guards (lookbehind, pipeline DB import, rank ordering)
        run: bash scripts/ci/guards.sh source

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client is a build-time codegen artifact that every workspace's types
      # depend on. Without it, tsc reports phantom "Property X does not exist on type
      # PrismaClient" errors. Needs no live database.
      - name: Generate Prisma client
        run: npm run db:generate

      # Write the .env files the Prisma CLI and the API read at runtime. They are
      # gitignored, so a fresh clone has none.
      - name: Write env files
        run: |
          for target in .env apps/api/.env packages/db/.env; do
            mkdir -p "$(dirname "$target")"
            {
              echo "DATABASE_URL=$DATABASE_URL"
              echo "JWT_SECRET=$JWT_SECRET"
              echo "JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET"
              echo "SEED_ADMIN_PASSWORD=$SEED_ADMIN_PASSWORD"
            } > "$target"
          done
          for app in client internal hr jobs web; do
            echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" > "apps/$app/.env.local"
          done

      # apps/api has no compile step (it runs via tsx), so its types are never checked by
      # `turbo build`. Check it explicitly — this is where the API bugs would hide.
      - name: Typecheck API
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      # packages/shared and packages/ui are typechecked as part of `npm run build`
      # (turbo's build task has dependsOn: ["^build"], so dependencies build first).

      # Builds all six apps. This is what typechecks the five Next.js frontends and is
      # the same command the server runs on deploy — so a green build here means the
      # deploy's build step will not be the thing that fails.
      - name: Build all apps
        run: npm run build

      # P8: the source scan cannot see third-party code (dnd-kit, markdown renderers,
      # vendored libraries), so also scan the HR bundle that actually ships.
      - name: Guard (no lookbehind in the built HR bundle)
        run: bash scripts/ci/guards.sh bundle

      - name: Push schema to test database
        run: npm run db:push

      # scripts/pipeline-ddl.sql and scripts/pipeline-email-ddl.sql are applied to production
      # BY HAND, before their PRs merge (spec §12; docs/superpowers/plans/
      # 2026-09-30-pipeline-email-runbook.md). tests/pipeline/ddl-script.test.ts and
      # email-ddl-script.test.ts only read them as text, so a broken statement inside a DO
      # block or a CREATE would otherwise first fail during the production apply. Execute them
      # for real on a scratch database of their own (never the suite's database): build the
      # full schema, drop ONLY the six pipeline tables (the outbox first — it references
      # pipeline_projects) so every CREATE / index / FK / seed path runs, apply each script
      # twice (the second run must be a clean no-op), check the outbox's PARTIAL unique index
      # (Prisma cannot express it — it exists only because the email script built it), then
      # require that Prisma sees no drift against schema.prisma (`--exit-code`: 0 = none;
      # Prisma ignores partial indexes, so the hand-built one is not drift).
      # The PIPELINE enum value survives the drop (Postgres cannot remove one), so ADD VALUE
      # takes its IF NOT EXISTS path here; the static test locks that statement's text.
      - name: Rehearse the pipeline DDL scripts
        env:
          DDL_DB_URL: postgresql://user:password@localhost:5432/dashmani_ddl_rehearsal
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          PG="docker exec -i -e PGPASSWORD=password $PG_CONTAINER psql -U user -v ON_ERROR_STOP=1 -q"
          $PG -d dashmani -c "CREATE DATABASE dashmani_ddl_rehearsal"
          DATABASE_URL="$DDL_DB_URL" npx prisma db push --schema packages/db/prisma/schema.prisma --skip-generate
          $PG -d dashmani_ddl_rehearsal -c "DROP TABLE pipeline_email_outbox, pipeline_messages, pipeline_participants, pipeline_projects, pipeline_phases, pipeline_board_state, meta_post_watch"
          for script in scripts/pipeline-ddl.sql scripts/pipeline-email-ddl.sql scripts/posting-watch-ddl.sql; do
            for run in 1 2; do
              echo "apply $script #$run"
              $PG -d dashmani_ddl_rehearsal -f - < "$script"
            done
          done
          $PG -d dashmani_ddl_rehearsal -Atc "SELECT count(*) FROM pipeline_phases" | grep -qx 7
          $PG -d dashmani_ddl_rehearsal -Atc "SELECT count(*) FROM pipeline_board_state" | grep -qx 1
          $PG -d dashmani_ddl_rehearsal -Atc "SELECT indexdef FROM pg_indexes WHERE indexname = 'pipeline_email_outbox_pending_key'" \
            | grep -qF "CREATE UNIQUE INDEX pipeline_email_outbox_pending_key ON public.pipeline_email_outbox USING btree (user_id, project_id, kind) WHERE ((status)::text = 'pending'::text)"
          npx prisma migrate diff --from-url "$DDL_DB_URL" \
            --to-schema-datamodel packages/db/prisma/schema.prisma --exit-code

      # ⚠️ Run from apps/api, never the repo root. There is no root vitest.config.*, so a
      # root-level run globs stale test copies under .claude/worktrees/ and executes them
      # in parallel against one Postgres, fabricating failures. apps/api/vitest.config.ts
      # sets pool:forks + singleFork:true, which is mandatory because the DB-backed suites
      # share a database and create fixed-email rows.
      - name: Run API test suite
        working-directory: apps/api
        run: npx vitest run --reporter=verbose

  # Pipeline concurrency suite (P8; spec §11): tests-concurrency/pipeline/ — the wiring
  # smoke test, the races (parallel posts, moves, adds, rebalance, fan-out vs ack) and the
  # skip-freedom proof. vitest.concurrency.config.ts never reads the repo-root .env and
  # refuses a non-localhost DATABASE_URL or the dev database, so this job's own
  # DATABASE_URL below is the only one it can use.
  #
  # Separate job, separate database: the main suite pins connection_limit=1 (see above),
  # which serialises every query and so can never show interleaving. This job runs its own
  # vitest config (pool: forks, singleFork: true — files still never run in parallel
  # against one database) with the pipeline pool at its production size of 3.
  pipeline-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          # The container creates this database at startup — the job's own DB, never the
          # main suite's.
          POSTGRES_DB: dashmani_pipeline_cc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d dashmani_pipeline_cc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/dashmani_pipeline_cc?connection_limit=10
      PIPELINE_DB_CONNECTIONS: "3"
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-secret-refresh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # `npm run -w` runs the Prisma CLI directly (not through turbo), so the job-level
      # DATABASE_URL reaches it; no .env files are written in this job.
      - name: Push schema to the concurrency database
        run: npm run db:push -w @dashmani/db -- --skip-generate

      - name: Run pipeline concurrency suite
        working-directory: apps/api
        run: npx vitest run -c vitest.concurrency.config.ts --reporter=verbose
